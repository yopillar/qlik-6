# Outils de qualite du kit. A lancer avant chaque commit :
#   ruff format . && ruff check . && mypy
#   python -m pytest
[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["tests/demo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # longueur des lignes : ruff format s'en charge, sauf chaines longues
]

[tool.ruff.lint.isort]
known-first-party = ["conf", "prepare", "qlik2sql", "fill_conf", "compare",
                     "journal", "job_template", "orchestrate", "translate",
                     "check", "verify", "assemble", "migrate", "normalize",
                     "conftest", "spark_foundation"]

[tool.mypy]
python_version = "3.10"
files = ["tools", "tests"]
exclude = ["tests/demo/"]
mypy_path = ["tools", "tests/fakelib"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
